---
- name: Offline-repo-stack installer
  hosts: all
  become: true
  vars_files:
    - vars.yaml

  vars:
    install_base: "{{ paths.install_base }}"
    nginx_dir: "{{ install_base }}/nginx"
    nexus_dir: "{{ install_base }}/nexus"
    uninstall: false

  tasks:
    # ================================================================
    #  PREREQUISITES
    # ================================================================
    - name: Detect compose command
      ansible.builtin.shell:
        cmd: |
          if docker compose version >/dev/null 2>&1; then
            echo "docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "docker-compose"
          else
            echo ""
          fi
      register: compose_check
      changed_when: false

    - name: Set compose command fact
      ansible.builtin.set_fact:
        compose_cmd: "{{ compose_check.stdout | trim }}"

    - name: Install prerequisite packages
      when: not (uninstall | bool)
      block:
        - name: Gather package facts
          ansible.builtin.package_facts:
            manager: auto

        - name: Install required packages (Debian/Ubuntu)
          when: ansible_os_family == "Debian"
          ansible.builtin.apt:
            name:
              - docker-compose-plugin
              - openssl
              - curl
            state: present
            update_cache: true

        - name: Install required packages (RHEL/CentOS)
          when: ansible_os_family == "RedHat"
          ansible.builtin.yum:
            name:
              - docker-compose-plugin
              - openssl
              - curl
            state: present

        - name: Re-detect compose command after install
          ansible.builtin.shell:
            cmd: |
              if docker compose version >/dev/null 2>&1; then
                echo "docker compose"
              elif command -v docker-compose >/dev/null 2>&1; then
                echo "docker-compose"
              else
                echo ""
              fi
          register: compose_recheck
          changed_when: false

        - name: Update compose command fact
          ansible.builtin.set_fact:
            compose_cmd: "{{ compose_recheck.stdout | trim }}"

        - name: Verify Docker compose is available
          ansible.builtin.fail:
            msg: >-
              Neither 'docker compose' (plugin) nor 'docker-compose' (standalone) is available.
              Install docker-compose-plugin or docker-compose before continuing.
          when: compose_cmd == ""

    # ================================================================
    #  UNINSTALL
    # ================================================================
    - name: "UNINSTALL: Stop and remove containers (compose)"
      when: uninstall | bool and compose_cmd != ""
      ansible.builtin.shell:
        cmd: "{{ compose_cmd }} down --remove-orphans --volumes"
        chdir: "{{ install_base }}"
      ignore_errors: true

    - name: "UNINSTALL: Stop and remove containers (fallback)"
      when: uninstall | bool and compose_cmd == ""
      block:
        - name: "UNINSTALL: List project containers"
          ansible.builtin.shell:
            cmd: docker ps -aq --filter "name=nexus" --filter "name=nginx-proxy" --filter "name=nexus-provision" --filter "name=tftp-server"
          register: container_ids
          changed_when: false
          ignore_errors: true

        - name: "UNINSTALL: Stop running containers"
          ansible.builtin.shell:
            cmd: "docker stop {{ container_ids.stdout_lines | join(' ') }}"
          when: container_ids.stdout_lines | length > 0
          ignore_errors: true

        - name: "UNINSTALL: Remove containers"
          ansible.builtin.shell:
            cmd: "docker rm -f {{ container_ids.stdout_lines | join(' ') }}"
          when: container_ids.stdout_lines | length > 0
          ignore_errors: true

        - name: "UNINSTALL: Remove project network"
          ansible.builtin.shell:
            cmd: docker network rm offline-repo-stack_repo-net
          ignore_errors: true

    - name: "UNINSTALL: Remove installed config directory"
      when: uninstall | bool
      ansible.builtin.file:
        path: "{{ install_base }}"
        state: absent

    - name: "UNINSTALL: Remove data directories"
      when: uninstall | bool
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ paths.mnt_nexus }}"
        - "{{ paths.mnt_nginx }}"
        - "{{ paths.mnt_tftp }}"

    - name: "UNINSTALL: Remove service accounts"
      when: uninstall | bool
      ansible.builtin.user:
        name: "{{ item.value.name }}"
        state: absent
        remove: true
      loop: "{{ service_accounts | dict2items }}"
      loop_control:
        label: "{{ item.value.name }}"

    - name: "UNINSTALL: Remove service groups"
      when: uninstall | bool
      ansible.builtin.group:
        name: "{{ item.value.name }}"
        state: absent
      loop: "{{ service_accounts | dict2items }}"
      loop_control:
        label: "{{ item.value.name }}"

    - name: "UNINSTALL: Summary"
      when: uninstall | bool
      ansible.builtin.debug:
        msg: >-
          Uninstall complete. Removed:
          - Containers and volumes
          - Config at {{ install_base }}
          - Data directories: {{ paths.mnt_nexus }}, {{ paths.mnt_nginx }}, {{ paths.mnt_tftp }}
          - Service accounts: {{ service_accounts | dict2items | map(attribute='value.name') | join(', ') }}
          {% if tls.self_signed | default(false) %}- Self-signed certs at {{ tls.cert_dir }}{% endif %}

    - name: "UNINSTALL: End play"
      when: uninstall | bool
      ansible.builtin.meta: end_play

    # ================================================================
    #  INSTALL
    # ================================================================

    # ── Service accounts ─────────────────────────────────────────────
    - name: Create service groups
      ansible.builtin.group:
        name: "{{ item.value.name }}"
        gid: "{{ item.value.gid }}"
        system: true
        state: present
      loop: "{{ service_accounts | dict2items }}"
      loop_control:
        label: "{{ item.value.name }} (gid={{ item.value.gid }})"

    - name: Create service accounts
      ansible.builtin.user:
        name: "{{ item.value.name }}"
        uid: "{{ item.value.uid }}"
        group: "{{ item.value.name }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present
      loop: "{{ service_accounts | dict2items }}"
      loop_control:
        label: "{{ item.value.name }} (uid={{ item.value.uid }})"

    # ── Directory structure ──────────────────────────────────────────
    - name: Create install directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ install_base }}"
        - "{{ nginx_dir }}"
        - "{{ nginx_dir }}/conf.d"
        - "{{ nexus_dir }}"
        - "{{ nexus_dir }}/repos"

    - name: Ensure VHD mount points exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ paths.mnt_nexus }}"
        - "{{ paths.mnt_nginx }}"
        - "{{ paths.mnt_tftp }}"

    - name: Create Nexus Java preferences directory
      ansible.builtin.file:
        path: "{{ paths.mnt_nexus }}/.java/.userPrefs"
        state: directory
        owner: "{{ service_accounts.nexus.uid }}"
        group: "{{ service_accounts.nexus.gid }}"
        mode: "0755"

    - name: Set VHD directory ownership to service accounts
      ansible.builtin.file:
        path: "{{ item.1 }}"
        state: directory
        owner: "{{ item.0.value.uid }}"
        group: "{{ item.0.value.gid }}"
        mode: "0755"
        recurse: true
      loop: >-
        {{ service_accounts | dict2items
           | subelements('value.owns') }}
      loop_control:
        label: "{{ item.1 }} -> {{ item.0.value.name }}"

    - name: Create TLS cert directory
      ansible.builtin.file:
        path: "{{ tls.cert_dir }}"
        state: directory
        owner: "{{ service_accounts.nginx.uid }}"
        group: "{{ service_accounts.nginx.gid }}"
        mode: "0750"

    # ── Self-signed TLS certificate (optional) ──────────────────────
    - name: Check if TLS cert already exists
      ansible.builtin.stat:
        path: "{{ tls.cert_path }}"
      register: tls_cert_stat

    - name: Generate self-signed wildcard certificate
      when: tls.self_signed | default(false) and not tls_cert_stat.stat.exists
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -nodes -newkey rsa:4096
          -days {{ tls.self_signed_days | default(365) }}
          -keyout {{ tls.key_path }}
          -out {{ tls.cert_path }}
          -subj "/CN=*.{{ domain_suffix }}"
          -addext "subjectAltName=DNS:*.{{ domain_suffix }},DNS:{{ domain_suffix }}"

    - name: Set certificate file ownership and permissions
      when: tls.self_signed | default(false) and not tls_cert_stat.stat.exists
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ service_accounts.nginx.uid }}"
        group: "{{ service_accounts.nginx.gid }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ tls.cert_path }}"
          mode: "0644"
        - path: "{{ tls.key_path }}"
          mode: "0600"

    - name: Self-signed cert status
      ansible.builtin.debug:
        msg: >-
          {% if tls.self_signed | default(false) %}
          {% if tls_cert_stat.stat.exists %}Self-signed cert already at {{ tls.cert_path }}, skipping.
          {% else %}Generated self-signed wildcard cert: {{ tls.cert_path }} ({{ tls.self_signed_days }} days).
          {% endif %}
          {% else %}Self-signed disabled. Place external cert at {{ tls.cert_path }} and key at {{ tls.key_path }}.
          {% endif %}

    # ── Docker Compose ───────────────────────────────────────────────
    - name: Render docker-compose.yml
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ install_base }}/docker-compose.yml"
        mode: "0644"

    # ── Nginx configs ────────────────────────────────────────────────
    - name: Render nginx.conf
      ansible.builtin.template:
        src: templates/nginx/nginx.conf.j2
        dest: "{{ nginx_dir }}/nginx.conf"
        mode: "0644"

    - name: Render ssl-params.conf
      ansible.builtin.template:
        src: templates/nginx/ssl-params.conf.j2
        dest: "{{ nginx_dir }}/ssl-params.conf"
        mode: "0644"

    - name: Render default vhost
      ansible.builtin.template:
        src: templates/nginx/conf.d/default.conf.j2
        dest: "{{ nginx_dir }}/conf.d/default.conf"
        mode: "0644"

    - name: Render repository vhosts
      ansible.builtin.template:
        src: templates/nginx/conf.d/repo-vhost.conf.j2
        dest: "{{ nginx_dir }}/conf.d/{{ item.hostname }}.conf"
        mode: "0644"
      loop: "{{ repositories }}"
      loop_control:
        label: "{{ item.hostname }}.{{ domain_suffix }}"

    # ── Nexus provisioner ────────────────────────────────────────────
    - name: Render nexus provisioner script
      ansible.builtin.template:
        src: templates/nexus/provision.py.j2
        dest: "{{ nexus_dir }}/provision.py"
        mode: "0755"

    - name: Render nexus repository definitions
      ansible.builtin.template:
        src: templates/nexus/repo.json.j2
        dest: "{{ nexus_dir }}/repos/{{ item.name }}.json"
        mode: "0644"
      loop: "{{ repositories }}"
      loop_control:
        label: "{{ item.name }}"

    # ── Verification ─────────────────────────────────────────────────
    - name: Show installed file tree
      ansible.builtin.command:
        cmd: find {{ install_base }} -type f
      register: file_tree
      changed_when: false

    - name: Display installed files
      ansible.builtin.debug:
        var: file_tree.stdout_lines

    - name: Post-install instructions
      ansible.builtin.debug:
        msg: >-
          Installation complete.

          Service accounts created:
          {% for svc in service_accounts | dict2items %}
            {{ svc.value.name }} (uid={{ svc.value.uid }}, gid={{ svc.value.gid }})
          {% endfor %}

          TLS certificates: {{ tls.cert_path }}
          {% if tls.self_signed | default(false) %}(self-signed, {{ tls.self_signed_days }} days){% else %}(external -- place before starting){% endif %}

          Start: cd {{ install_base }} && {{ compose_cmd }} up -d
          Uninstall: ansible-playbook install.yml -e uninstall=true -i "localhost," -c local
